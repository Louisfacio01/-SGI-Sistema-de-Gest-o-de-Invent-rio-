<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechStore - Login</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>

    <div class="glass-card">
        <div style="text-align: center; margin-bottom: 25px;">
            <h2 style="margin: 0; font-weight: bold;">TechStore SGI</h2>
            <p style="margin: 5px 0 0 0; font-size: 13px; opacity: 0.7;">Acesse com suas credenciais</p>
        </div>

          {% with messages = get_flashed_messages(with_categories=true) %}
                    {% if messages %}
                              {% for category, message in messages %}
                                        <div class="{% if category == 'success' %}alert-success-glass{% else %}alert-danger-glass{% endif %}">
                    {{ message }}
                                        </div>
                              {% endfor %}
                    {% endif %}
          {% endwith %}

        <form method="POST" action="/login">
            <div style="margin-bottom: 15px;">
                <label style="font-size: 13px; display: block; margin-bottom: 5px;">E-mail Corporativo</label>
                <input type="email" name="email" class="form-control" placeholder="ex: operador@techstore.com" required>
            </div>
            <div style="margin-bottom: 25px;">
                <label style="font-size: 13px; display: block; margin-bottom: 5px;">Senha</label>
                <input type="password" name="senha" class="form-control" placeholder="******" required>
            </div>
            <button type="submit" class="btn-glass" style="width: 100%; background: rgba(13, 202, 240, 0.2); border-color: rgba(13, 202, 240, 0.4); color: #0dcaf0; cursor: pointer;">Entrar no Sistema</button>
        </form>
    </div>

</body>
</html>
