<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>TechStore - Cadastrar Ativo</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <div class="glass-panel">
        <h1>Novo Ativo</h1>
        <form action="/produto/novo" method="POST">
            <div class="form-group">
                <label>SKU:</label>
                <input type="text" name="sku" class="form-control" required>
            </div>
            <div class="form-group">
                <label>Nome Comercial:</label>
                <input type="text" name="nome_comercial" class="form-control" required>
            </div>
            <div class="form-group">
                <label>Fabricante:</label>
                <input type="text" name="fabricante" class="form-control" required>
            </div>
            <div class="form-group">
                <label>Categoria:</label>
                <select name="id_categoria" class="form-control" required>
                    <option value="">Selecione...</option>
                    {% for c in categorias %}
                    <option value="{{ c.id_categoria }}">{{ c.nome }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label>Fornecedor:</label>
                <select name="id_fornecedor" class="form-control" required>
                    <option value="">Selecione...</option>
                    {% for f in fornecedores %}
                    <option value="{{ f.id_fornecedor }}">{{ f.razao_social }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label>Preço de Venda:</label>
                <input type="number" step="0.01" name="preco_venda" class="form-control" required>
            </div>
            <div class="form-group">
                <label>Quantidade em Estoque:</label>
                <input type="number" name="quantidade_estoque" class="form-control" required>
            </div>
            <div class="form-group">
                <label>Localização:</label>
                <input type="text" name="localizacao" class="form-control" required>
            </div>
            <div class="form-actions">
                <button type="submit" class="btn-glass">Salvar Ativo</button>
                <a href="/" class="btn-glass" style="text-decoration: none;">Voltar</a>
            </div>
        </form>
    </div>
</body>
</html>
